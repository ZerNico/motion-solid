name: Deploy docs

# Publishing a GitHub release deploys the docs from its tag to Cloudflare Pages
# (motion-solid.pages.dev). Running the workflow by hand deploys the branch or tag it's run on,
# e.g. `main` for a docs fix between releases. Needs a Direct Upload Pages project named
# `motion-solid` (production branch `main`), and the `docs` environment with the secret
# `CLOUDFLARE_API_TOKEN` (permission: Cloudflare Pages Edit) and the variable
# `CLOUDFLARE_ACCOUNT_ID` (not secret: it only identifies the account).

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-docs
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment:
            name: docs
            url: https://motion-solid.pages.dev
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium

            - run: pnpm --filter docs typecheck
            - run: pnpm docs:build

            # Opens every page of the built site and fails on errors in the browser console.
            - name: Check the pages
              run: |
                  pnpm --filter docs preview --host 127.0.0.1 --port 4173 --strictPort &
                  for _ in $(seq 30); do
                    curl -sf http://127.0.0.1:4173/ > /dev/null && break
                    sleep 1
                  done
                  pnpm --filter docs check:pages --base http://127.0.0.1:4173

            # `--branch main` makes it the production deployment.
            - name: Deploy
              working-directory: docs
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
              run: pnpm exec wrangler pages deploy dist/client --project-name motion-solid --branch main
