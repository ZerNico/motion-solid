name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Lint, types, jsdom tests, package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm exec vitest run --project motion-solid
            - run: pnpm check:package

    browser:
        name: Browser tests (${{ matrix.browser }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
            - run: pnpm exec vitest run --project motion-solid-browser
              env:
                  VITEST_BROWSER: ${{ matrix.browser }}
